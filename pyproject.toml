[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=6"]
build-backend = "setuptools.build_meta"

[project]
name = "secop-check"
dynamic = ["version"]
authors = [
    {name="Georg Brandl", email="g.brandl@fz-juelich.de"},
    {name="Alexander Zaft", email="a.zaft@fz-juelich.de"},    
]
license = "GPL-2.0-or-later"
description = "Add your description here"
readme = "README.rst"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=5.4",
]

[project.scripts]
secop-check = "secop_check.cmdline:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["secop_check"]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN", "D1", "D203", "D213", "ERA", "FIX", "SIM", "S101", "TD"]
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 20
pylint.max-branches = 20
