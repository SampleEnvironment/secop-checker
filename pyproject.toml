[build-system]
requires = ["setuptools>=62.6", "setuptools-scm>=7.1"]
build-backend = "setuptools.build_meta"

[project]
name = "secop-check"
dynamic = ["version"]
authors = [
    {name="Georg Brandl", email="g.brandl@fz-juelich.de"},
    {name="Alexander Zaft", email="a.zaft@fz-juelich.de"},    
]
license = "GPL-2.0-or-later"
description = "Schema checker for SECoP descriptive metadata"
readme = "README.rst"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=5.4",
]

[project.scripts]
secop-check = "secop_check.cmdline:main"

[dependency-groups]
dev = ["pytest", "ruff"]
typing = ["mypy", "types-PyYAML", "pyright", "ty"]

[tool.uv]
cache-keys = [{file = "pyproject.toml"}, {git = {commit = true, tags = true}}]

[tool.setuptools.packages.find]
include = ["secop_check*"]

[tool.setuptools_scm]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D1", "D203", "D213", "EM", "FIX", "S101", "TD", "TRY003"]
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 20
pylint.max-branches = 20
