<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SECoP validator</title>
  <link href="pico.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.2/full/pyodide.js"></script>
</head>
<body>
  <main class="container">
      <section>
        <nav>
          <ul>
            <li><h3>SECoP descriptive data validator</h3></li>
          </ul>
          <ul>
            <li>
              <div class="status-badge" id="status">
                <span class="spinner" id="spinner"></span>
                <span id="status-text">Loading Python…</span>
              </div>
            </li>
          </ul>
        </nav>
        <p>Entered data is not sent to any server, it is directly processed in the browser.</p>
        <textarea id="inputBox"
                  placeholder="Paste your SECoP JSON description here!"
                  rows="8" cols="33"></textarea>
        <div class="action-row">
          <button id="checkBtn" onclick="runCheck()" disabled>Check</button>
          <label><input type="checkbox" id="annotateCb"> Annotate JSON</label>
          <label>SECoP version:</label>
          <select id="versionSelect" class="version-select">
            <option value="1.0">1.0</option>
            <option value="1.1">1.1</option>
            <option value="2.0" selected>2.0</option>
          </select>
        </div>
      </section>
      <section>
        <div id="results"></div>
      </section>
  </main>

  <script>
    let pyodide = null;

    async function init() {
      const statusText = document.getElementById('status-text');

      try {
        pyodide = await loadPyodide();
        statusText.textContent = 'Loading micropip…';
        await pyodide.loadPackage('micropip');
        const micropip = pyodide.pyimport('micropip');
        statusText.textContent = 'Loading secop-check…';
        await micropip.install('./secop_check-0.1.0-py3-none-any.whl');
        statusText.textContent = 'Ready';
        document.getElementById('spinner').hidden = true;
        document.getElementById('status').classList.add('ready');
        document.getElementById('checkBtn').disabled = false;
      } catch (e) {
        statusText.textContent = 'Failed: ' + e.message;
        document.getElementById('spinner').hidden = true;
        document.getElementById('status').classList.add('failed');
        console.error(e);
      }
    }

    init();

    async function runCheck() {
      const text = document.getElementById('inputBox').value;
      const results = document.getElementById('results');
      const annotated = document.getElementById('annotateCb').checked;

      if (!text.trim()) {
        results.innerHTML = '<article class="diag hint">Please enter a SECoP description.</article>';
        return;
      }

      results.innerHTML = '<div class="check-spinner-wrapper"><div class="spinner spinner-large"></div></div>';

      await new Promise(r => setTimeout(r, 20));

      const version = document.getElementById('versionSelect').value;
      pyodide.globals.set('input_text', text);
      pyodide.globals.set('check_version', version);
      pyodide.globals.set('annotated_mode', annotated);

      pyodide.runPython(`
import json
import traceback
from secop_check.checker import Checker
from secop_check.formatting import get_annotated_display
from secop_check import Catastrophe, Severity

try:
    checker = Checker(check_version, [], output="none")
    try:
        checker.check(input_text)
    except Catastrophe:
        pass

    diags = []
    for d in checker.get_diags():
        diags.append({
            'severity': d.severity.name.lower(),
            'step': d.step,
            'msg': d.msg,
            'ctx': ' / '.join(str(p) for p in d.ctx.path).strip(),
        })

    summary = {'hint': 0, 'warning': 0, 'error': 0, 'catastrophic': 0}
    for d in diags:
        summary[d['severity']] += 1
    result = {'diags': diags, 'summary': summary}

    if annotated_mode:
        try:
            lines, line_diags, unmatched = \
                get_annotated_display(checker.get_diags(), input_text)
            result['annotation'] = {
                'lines': lines,
                'line_diags': {str(k): v for k, v in line_diags.items()},
            }
        except Exception as err:
            result['ann_err'] = f'could not build annotations: {err}'

except Exception as exc:
    result = {
        'diags': [{
            'severity': 'catastrophic',
            'step': 'python',
            'msg': str(exc),
            'ctx': traceback.format_exc(),
        }]
    }
      `);

      const result = pyodide.globals.get('result').toJs();

      const summaryHtml = renderSummary(result.summary || {});
      let listHtml;
      if (result.diags.length === 0) {
        listHtml = '';
      } else if (result.annotation) {
        listHtml = renderAnnotated(result);
      } else {
        listHtml = renderPanels(result.diags);
      }
      results.innerHTML = summaryHtml + listHtml;
    }

    function renderPanels(diags) {
      let html = '';
      for (const d of diags) {
        html += '<article class="diag ' + d.severity + '">';
        html += '<header>' + d.severity.toUpperCase() + '</header>';
        html += '<div class="diag-body">';
        if (d.step !== '')
          html += '<span class="step">[' + escapeHtml(d.step) + ']</span> ';
        html += 'in <span class="ctx">' + escapeHtml(d.ctx) + ':</span>';
        html += '<div class="msg">' + escapeHtml(d.msg) + '</div>';
        html += '</div></article>';
      }
      return html;
    }

    function renderSummary(summary) {
      const items = ['<span>Messages:</span>'];
      if (summary.catastrophic)
        items.push('<span class="summary-catastrophic">Catastrophic: ' + summary.catastrophic + '</span>');
      if (summary.error)
        items.push('<span class="summary-error">Errors: ' + summary.error + '</span>');
      if (summary.warning)
        items.push('<span class="summary-warning">Warnings: ' + summary.warning + '</span>');
      if (summary.hint)
        items.push('<span class="summary-hint">Hints: ' + summary.hint + '</span>');
      if (!items.length)
        items.push('<span class="summary-ok">All good</span>');
      return '<div class="summary-bar">' + items.join('') + '</div>';
    }

    function renderAnnotated(result) {
      // TODO ann_err
      const ann = result.annotation;
      const lines = ann.lines;
      const lineDiags = ann.line_diags;
      let html = '<table class="annotated">';
      for (let i = 0; i < lines.length; i++) {
        const diags = lineDiags[i + 1] || [];
        const rowClass = diags.length ? 'has-diag' : '';
        html += '<tr class="' + rowClass + '">';
        html += '<td class="json-line">' + highlightJson(lines[i]) + '</td>';
        html += '<td class="diag-cell">';
        for (const d of diags) {
          html += '<span class="ann-badge ' + d.severity + '">' + d.severity.toUpperCase() + '</span>';
          html += ' <span class="ann-step">[' + escapeHtml(d.step) + ']</span>';
          html += ': ' + escapeHtml(d.msg);
        }
        html += '</td>';
        html += '</tr>';
      }
      html += '</table>';
      return html;
    }

    function highlightJson(line) {
      const tokenRe = /("(?:[^"\\]|\\.)*")\s*:|("(?:[^"\\]|\\.)*")|(\btrue\b|\bfalse\b|\bnull\b)|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
      return line.replace(tokenRe, function(match, key, str, lit, num) {
        if (key) return '<span class="j-key">' + escapeHtml(key) + '</span>:';
        if (str) return '<span class="j-str">' + escapeHtml(str) + '</span>';
        if (lit) return '<span class="j-lit">' + escapeHtml(lit) + '</span>';
        if (num) return '<span class="j-num">' + escapeHtml(num) + '</span>';
        return escapeHtml(match);
      });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
