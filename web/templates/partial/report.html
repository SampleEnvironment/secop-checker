<div class="errors-div" id=errors-div data-x="errors">
{% for err in errors %}
<details open class="diag {{ err.severity.name.lower() }}">
    <summary>{{ err.severity.name.capitalize() }} {{ err.step }}</summary>
    <p class="diag-inner">
    {{ fmt_err(err) }}: {{ err.msg }}
    </p>
</details>
{% endfor %}
</div>
